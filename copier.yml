_min_copier_version: "9.6.0"
_subdirectory: template
_templates_suffix: .jinja
_answers_file: .copier-answers.yaml
_envops:
  keep_trailing_newline: true

_skip_if_exists:
  - CHANGELOG.md
  - LICENSE

_message_before_copy: |
  生成 C++ / CMake 工程。直接回车可用默认值。

_message_after_copy: |
  已生成：{{ _copier_conf.dst_path }}

    cd "{{ _copier_conf.dst_path }}"
    git init
    cmake --workflow --preset {% if 'windows' in platforms and 'x64' in architectures and 'msvc' in windows_compilers %}windows-x64-msvc-vs-debug{% elif 'windows' in platforms and 'x64' in architectures and 'clang-cl' in windows_compilers %}windows-x64-clang-cl-ninja-debug{% elif 'windows' in platforms and 'x64' in architectures and 'clang' in windows_compilers %}windows-x64-clang-ninja-debug{% elif 'windows' in platforms and 'arm64' in architectures and 'msvc' in windows_compilers %}windows-arm64-msvc-vs-debug{% elif 'windows' in platforms and 'arm64' in architectures and 'clang-cl' in windows_compilers %}windows-arm64-clang-cl-ninja-debug{% elif 'windows' in platforms and 'arm64' in architectures and 'clang' in windows_compilers %}windows-arm64-clang-ninja-debug{% elif 'linux' in platforms and 'x64' in architectures and 'gcc' in linux_compilers and 'ninja' in linux_generators %}linux-x64-gcc-ninja-debug{% elif 'linux' in platforms and 'x64' in architectures and 'gcc' in linux_compilers and 'make' in linux_generators %}linux-x64-gcc-make-debug{% elif 'linux' in platforms and 'x64' in architectures and 'clang' in linux_compilers and 'ninja' in linux_generators %}linux-x64-clang-ninja-debug{% elif 'linux' in platforms and 'x64' in architectures and 'clang' in linux_compilers and 'make' in linux_generators %}linux-x64-clang-make-debug{% elif 'linux' in platforms and 'arm64' in architectures and 'gcc' in linux_compilers and 'ninja' in linux_generators %}linux-arm64-gcc-ninja-debug{% elif 'linux' in platforms and 'arm64' in architectures and 'gcc' in linux_compilers and 'make' in linux_generators %}linux-arm64-gcc-make-debug{% elif 'linux' in platforms and 'arm64' in architectures and 'clang' in linux_compilers and 'ninja' in linux_generators %}linux-arm64-clang-ninja-debug{% elif 'linux' in platforms and 'arm64' in architectures and 'clang' in linux_compilers and 'make' in linux_generators %}linux-arm64-clang-make-debug{% elif 'macos' in platforms and 'arm64' in architectures and 'clang' in macos_compilers and 'ninja' in macos_generators %}macos-arm64-clang-ninja-debug{% elif 'macos' in platforms and 'x64' in architectures and 'clang' in macos_compilers and 'ninja' in macos_generators %}macos-x64-clang-ninja-debug{% elif 'macos' in platforms and 'x64' in architectures and 'clang' in macos_compilers and 'xcode' in macos_generators %}macos-x64-clang-xcode-debug{% elif 'macos' in platforms and 'arm64' in architectures and 'clang' in macos_compilers and 'xcode' in macos_generators %}macos-arm64-clang-xcode-debug{% endif %}
  {%- if use_vcpkg %}

  vcpkg 清单由 _tasks 自动创建（看 VCPKG_ROOT，不要求在 PATH 里）。
  需要 copier copy --trust。未加 --trust 时手动：
    "$VCPKG_ROOT/vcpkg" new --name {{ project_slug | replace('_', '-') }} --version {{ version }}
  {%- if enable_testing %}
    "$VCPKG_ROOT/vcpkg" add port gtest
  {%- endif %}
  {%- endif %}

  preset 列表见 CMakePresets.json；本地覆盖写 CMakeUserPresets.json。

_message_after_update: |
  已更新 "{{ project_name }}"。有冲突先解决再构建。

# 生成后自动执行（需要 copier copy --trust，且已设置 VCPKG_ROOT；不依赖 PATH）
_tasks:
  - command:
      - "{{ _copier_python }}"
      - "-c"
      - |
        import os, subprocess, sys
        root = os.environ.get("VCPKG_ROOT")
        if not root:
            sys.exit("VCPKG_ROOT is not set")
        exe = os.path.join(root, "vcpkg.exe" if os.name == "nt" else "vcpkg")
        if not os.path.isfile(exe):
            sys.exit("vcpkg not found: " + exe)
        subprocess.check_call([exe, "new", "--name", "{{ project_slug | replace('_', '-') }}", "--version", "{{ version }}"])
    when: "{{ use_vcpkg }}"
  - command:
      - "{{ _copier_python }}"
      - "-c"
      - |
        import os, subprocess, sys
        root = os.environ.get("VCPKG_ROOT")
        if not root:
            sys.exit("VCPKG_ROOT is not set")
        exe = os.path.join(root, "vcpkg.exe" if os.name == "nt" else "vcpkg")
        if not os.path.isfile(exe):
            sys.exit("vcpkg not found: " + exe)
        subprocess.check_call([exe, "add", "port", "gtest"])
    when: "{{ use_vcpkg and enable_testing }}"

# --- 问卷 ---

project_name:
  type: str
  help: CMake 工程名称（project() / 目标名，字母开头，只能含字母、数字、下划线）
  default: "{{ _folder_name | regex_replace('[^A-Za-z0-9_]', '_') }}"
  validator: >-
    {% if not project_name %}
    工程名称不能为空
    {% elif not (project_name | regex_search('^[A-Za-z_][A-Za-z0-9_]*$')) %}
    必须是合法 CMake 标识符：字母或下划线开头，只含字母、数字、下划线
    {% endif %}

project_description:
  type: str
  help: 项目简介
  default: "A modern C++ project"

version:
  type: str
  help: 初始语义化版本号
  default: "0.1.0"
  validator: >-
    {% if not (version | regex_search('^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9]+)*$')) %}
    版本号格式应为 MAJOR.MINOR.PATCH，例如 0.1.0
    {% endif %}

author_name:
  type: str
  help: 作者姓名
  default: ""

author_email:
  type: str
  help: 作者邮箱
  default: ""

project_slug:
  type: str
  help: vcpkg 包名（小写；公开头目录用工程名，例如 MEngine）
  default: "{{ project_name | lower }}"
  validator: >-
    {% if not (project_slug | regex_search('^[a-z][a-z0-9_]*$')) %}
    只能使用小写字母、数字、下划线，且必须以字母开头
    {% endif %}

modules:
  type: yaml
  help: 库模块列表。每个名字生成 include/<工程名>/<Name>.hpp 与 src/<Name>/
  default:
    - Core
  validator: >-
    {% if modules is string or modules is mapping %}
    请使用 YAML 列表，例如
    - Core
    - Net
    {% elif not modules %}
    至少需要一个模块
    {% else %}
    {% for module in modules %}
    {% if not (module | string | regex_search('^[A-Za-z_][A-Za-z0-9_]*$')) %}
    模块名 '{{ module }}' 必须是合法标识符（字母或下划线开头，只含字母、数字、下划线）
    {% endif %}
    {% endfor %}
    {% endif %}

apps:
  type: yaml
  help: 可执行程序列表。每个名字生成 apps/<Name>/main.cpp（入口），默认链接全部库模块
  default:
    - "{{ project_name }}"
  validator: >-
    {% if apps is string or apps is mapping %}
    请使用 YAML 列表，例如
    - {{ project_name }}
    {% elif not apps %}
    至少需要一个可执行程序
    {% else %}
    {% for app in apps %}
    {% if not (app | string | regex_search('^[A-Za-z_][A-Za-z0-9_]*$')) %}
    可执行程序名 '{{ app }}' 必须是合法标识符（字母或下划线开头，只含字母、数字、下划线）
    {% endif %}
    {% if app in modules %}
    可执行程序 '{{ app }}' 与库模块重名
    {% endif %}
    {% endfor %}
    {% endif %}

namespace:
  type: str
  help: C++ 命名空间
  default: "{{ project_slug }}"
  validator: >-
    {% if not (namespace | regex_search('^[A-Za-z_][A-Za-z0-9_]*$')) %}
    必须是合法 C++ 标识符
    {% endif %}

cxx_standard:
  type: str
  help: C++ 标准
  choices:
    - "17"
    - "20"
    - "23"
  default: "23"

platforms:
  type: str
  help: 目标操作系统（决定生成哪些 toolchain 与 CMake preset）
  multiselect: true
  choices:
    Windows: windows
    Linux: linux
    macOS: macos
  default:
    - windows
    - linux
    - macos
  validator: "{% if not platforms %}至少选择一个目标系统{% endif %}"

architectures:
  type: str
  help: 目标架构
  multiselect: true
  choices:
    x64: x64
    ARM64: arm64
  default:
    - x64
    - arm64
  validator: "{% if not architectures %}至少选择一个架构{% endif %}"

windows_compilers:
  type: str
  help: Windows 编译器
  multiselect: true
  when: "{{ 'windows' in platforms }}"
  choices:
    MSVC: msvc
    Clang: clang
    clang-cl: clang-cl
  default:
    - msvc
    - clang
    - clang-cl
  validator: "{% if not windows_compilers %}至少选择一个 Windows 编译器{% endif %}"

windows_vs_generator:
  type: str
  help: MSVC 使用的 Visual Studio 版本
  when: "{{ 'windows' in platforms and 'msvc' in windows_compilers }}"
  choices:
    Visual Studio 2019: Visual Studio 16 2019
    Visual Studio 2022: Visual Studio 17 2022
    Visual Studio 2026 (CMake 4.2+): Visual Studio 18 2026
  default: Visual Studio 17 2022

windows_msvc_toolset:
  type: str
  help: MSVC 工具集（所选 Visual Studio 中需已安装该工具集及目标架构组件）
  when: "{{ 'windows' in platforms and 'msvc' in windows_compilers }}"
  choices:
    使用 Visual Studio 默认工具集: default
    MSVC v142: v142
    MSVC v143: v143
    MSVC v145: v145
  default: default
  validator: >-
    {% if windows_vs_generator == 'Visual Studio 16 2019' and windows_msvc_toolset in ['v143', 'v145'] %}
    VS2019 不支持所选工具集，请选择默认工具集或 v142。
    {% elif windows_vs_generator == 'Visual Studio 17 2022' and windows_msvc_toolset == 'v145' %}
    v145 工具集需要 VS2026，请更换 Visual Studio 版本或工具集。
    {% endif %}

linux_compilers:
  type: str
  help: Linux 编译器
  multiselect: true
  when: "{{ 'linux' in platforms }}"
  choices:
    GCC: gcc
    Clang: clang
  default:
    - gcc
    - clang
  validator: "{% if not linux_compilers %}至少选择一个 Linux 编译器{% endif %}"

macos_compilers:
  type: str
  help: macOS 编译器
  multiselect: true
  when: "{{ 'macos' in platforms }}"
  choices:
    Clang: clang
  default:
    - clang
  validator: "{% if not macos_compilers %}至少选择一个 macOS 编译器{% endif %}"

linux_generators:
  type: str
  help: Linux CMake 生成器
  multiselect: true
  when: "{{ 'linux' in platforms }}"
  choices:
    Ninja: ninja
    Unix Makefiles: make
  default:
    - ninja
    - make
  validator: "{% if not linux_generators %}至少选择一个 Linux 生成器{% endif %}"

macos_generators:
  type: str
  help: macOS CMake 生成器
  multiselect: true
  when: "{{ 'macos' in platforms }}"
  choices:
    Ninja: ninja
    Xcode: xcode
  default:
    - ninja
    - xcode
  validator: "{% if not macos_generators %}至少选择一个 macOS 生成器{% endif %}"

license:
  type: str
  help: 开源许可证
  choices:
    MIT: mit
    Apache-2.0: apache-2.0
    BSD-3-Clause: bsd-3-clause
    GNU GPLv3: gpl-3.0
    Unlicense: unlicense
    不生成 LICENSE: none
  default: mit

use_vcpkg:
  type: bool
  help: 启用 vcpkg（Presets/CI 接 toolchain；清单由生成后 vcpkg new 创建）
  default: true

enable_testing:
  type: bool
  help: 生成 GoogleTest 测试与 CTest
  default: true

use_github_actions:
  type: bool
  help: 生成 GitHub Actions CI 工作流
  default: true

warnings_as_errors:
  type: bool
  help: 默认将编译器警告视为错误
  default: false
